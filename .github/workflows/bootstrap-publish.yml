# TEMPORARY. Delete this file once every package has been published once.
#
# npm will not configure a trusted publisher for a package that has never been
# published, and unlike PyPI it has no pending-publisher to pre-register one:
#
#   https://github.com/npm/cli/issues/8544
#
# So the very first publish of a brand new package cannot use OIDC, and
# release.yml -- which is OIDC-only, on purpose -- cannot perform it. This
# workflow exists to break that circle exactly once, using a short-lived
# NPM_TOKEN secret.
#
# It runs only when a human dispatches it, only from `main` or a
# `changeset-release/*` branch, and only inside the `npm-bootstrap`
# environment. It is never triggered by a push, so it cannot publish behind
# your back.
#
# Before dispatching (done by hand):
#   1. The npm org @ember-joinery exists (npmjs.com is the only place to
#      create one), so the token below can publish into it.
#   2. Settings > Environments > New environment "npm-bootstrap":
#      - Required reviewers: yourself (the run waits for approval).
#      - Deployment branches and tags: "Selected branches and tags", adding
#        `main` and `changeset-release/*`.
#      - Environment secrets: add NPM_TOKEN (a granular token that can
#        publish @ember-joinery/*, with the shortest expiry npm
#        allows).
#   3. Remove any repository-level copy, so the token exists only behind the
#      environment's reviewers and branch rule:
#        gh secret delete NPM_TOKEN --repo joegaudet/ember-joinery
#
# Dispatch it on the Version Packages branch, `changeset-release/main`, after
# the version PR exists and before merging it:
#
#   gh workflow run bootstrap-publish.yml --repo joegaudet/ember-joinery \
#     --ref changeset-release/main -f confirm=publish
#
# There every package is already at the release version, so each new name's
# first published version is that release, with its dependencies on the other
# @ember-joinery packages resolved to the same release. Dispatched from `main`
# instead, it would publish the new names at the old version, with `workspace:*`
# resolved to the old packages -- a version that can never be reused.
# scripts/publish.mjs publishes everything missing, so this run publishes the
# whole release, existing names included (they already list release.yml as
# trusted publisher, but the token works for them too). The tag push then finds
# nothing left to publish and only creates the GitHub release.
#
# Here for 1.0.0, the first release, in which every @ember-joinery package is
# new. A package added after that restores this file from git history for its
# own first release.
#
# Afterwards:
#   1. npmjs.com, per package: Settings > Trusted publisher >
#      repository joegaudet/ember-joinery, workflow release.yml
#   2. Revoke the token on npmjs.com, then delete it from the environment:
#        gh secret delete NPM_TOKEN --env npm-bootstrap --repo joegaudet/ember-joinery
#   3. Delete this file (and the environment). release.yml handles every
#      release from then on.
name: bootstrap publish (one-shot)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to confirm this is the first publish'
        required: true
        default: ''

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    # A typo here publishes to a public registry permanently -- npm does not
    # let a version number be reused, even after an unpublish. Make the human
    # say so explicitly.
    #
    # And only from main or the Version Packages branch: the environment's
    # branch rule says the same, but a rule in settings is easy to lose.
    if: >-
      inputs.confirm == 'publish' &&
      (github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/heads/changeset-release/'))
    # NPM_TOKEN lives in this environment, behind required reviewers and a
    # branch rule, rather than as a repository secret any workflow can read.
    environment: npm-bootstrap
    permissions:
      contents: read
      # Provenance still works on the token path: the attestation is signed
      # with this OIDC token even though authentication uses NPM_TOKEN. This
      # is what keeps the bootstrap release from being the one unsigned
      # version in the package history.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No `cache: pnpm`: unprivileged jobs can write that store, so a publish job never restores it.
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      # `pnpm release` builds, then runs scripts/publish.mjs, which skips anything
      # already on the registry, so a re-run after a partial failure picks up only
      # what is still missing.
      - name: Publish every unpublished package
        run: pnpm release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
