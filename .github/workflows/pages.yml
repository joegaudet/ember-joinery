name: pages

# Publishes docs/site to GitHub Pages at joegaudet.com/ember-joinery/: the marketing page, styled
# with Joinery's own CSS (copied from the build into docs/site/joinery by `pnpm site:css`), plus
# the demo (built from test-app into docs/site/demo) and the guide (built from docs-app into
# docs/site/guide, with docs/site/404.html so the guide's deep links load), and the API reference
# (TypeDoc, `pnpm docs:api`, into docs/site/api).
#
# The demo and the guide are built from main. The API reference is built from the latest release's
# sources, so it never shows unreleased API: release.yml dispatches this after publishing, and a
# push to main keeps the reference at that release.
#
# It deploys only once the repository's Pages source is set to "GitHub Actions" (Settings,
# Pages). That's a repository setting, so the maintainer sets it.
on:
  push:
    branches: [main]
    paths:
      - 'docs/site/**'
      - 'test-app/app/**'
      - 'test-app/index.html'
      - 'test-app/public/**'
      - 'docs-app/**'
      - 'packages/*/src/**'
      - 'scripts/gen-*.mjs'
      - 'scripts/site-css.mjs'
      - 'docs/api.css'
      - 'typedoc.json'
      - 'tsconfig.api.json'
      - 'scripts/typedoc-site.mjs'
      - 'scripts/llms-full.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The tags, for the latest release.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm site:css
      - run: pnpm demo:build
      - run: pnpm guide:build
      # shortcut: only src comes from the tag, so a package added since the last release shows
      # up early; build the whole tag in a worktree if that starts to matter.
      - name: Use the latest release's sources for the API reference
        run: |
          tag=$(git describe --tags --abbrev=0 --match 'v*')
          git checkout "$tag" -- ':(glob)packages/*/src/**'
          # CI gates the docs on main; this renders what shipped, so a warning doesn't block a
          # deploy. (No gitRevision: sources are off, the reference reads built declarations.)
          node -e '
            const fs = require("node:fs"), c = JSON.parse(fs.readFileSync("typedoc.json"))
            c.treatWarningsAsErrors = false
            fs.writeFileSync("typedoc.json", JSON.stringify(c))
          '
      - run: pnpm build
      - run: pnpm docs:api
      - run: cp -R docs/api docs/site/api
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site
      - id: deployment
        uses: actions/deploy-pages@v5
