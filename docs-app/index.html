<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Joinery guide</title>
    <meta
      name="description"
      content="The Joinery guide: every shadcn/ui component for Ember, its primitives, harnesses and examples."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Geist, as on ui.shadcn.com; the parity runs use it too. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap"
    />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    {{content-for "head"}}

    <link integrity="" rel="stylesheet" href="/@embroider/virtual/vendor.css" />
    <link integrity="" rel="stylesheet" href="/@embroider/virtual/app.css" />

    {{content-for "head-footer"}}
  </head>
  <body>
    {{content-for "body"}}

    <script src="/@embroider/virtual/vendor.js"></script>
    <script type="module">
      import Application from './app/app'
      import environment from './app/config/environment'

      Application.create(environment.APP)
    </script>

    {{content-for "body-footer"}}
  </body>
</html>
