<!doctype html>
<!-- Source of site/social-card.png (1200x630). Its card is Joinery's own Card, Field, Input,
     Switch and Buttons, styled by Joinery's CSS, which `pnpm site:css` copies into site/joinery/.
     Render it with the site's other images:
       pnpm build && pnpm guide:build && pnpm site:css && pnpm site:screenshots --only social -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Joinery social card</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    />
    <style>
      :root {
        --font-sans: Inter, system-ui, sans-serif;
      }
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        display: grid;
        grid-template-columns: 1.3fr 1fr;
        align-items: center;
        gap: 56px;
        padding: 0 80px;
        box-sizing: border-box;
        font-family: Inter, system-ui, sans-serif;
        color: #f6f2ea;
        background:
          radial-gradient(36rem 26rem at 78% 50%, rgb(217 119 6 / 0.4), transparent 70%), #12110f;
      }
      .brand {
        display: flex;
        gap: 14px;
        align-items: center;
        font-weight: 800;
        font-size: 34px;
        margin-bottom: 34px;
      }
      h1 {
        margin: 0;
        font-size: 62px;
        line-height: 1.04;
        letter-spacing: -0.035em;
        font-weight: 800;
      }
      .accent {
        background: linear-gradient(90deg, #f5b04c, #ea580c);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p {
        margin: 26px 0 0;
        color: #cfc8bc;
        font-size: 25px;
        font-weight: 500;
      }
      .card {
        zoom: 1.15;
        border-radius: 16px;
        box-shadow: 0 30px 80px -20px rgb(217 119 6 / 0.6);
      }
      .card [data-slot='card-footer'] {
        justify-content: flex-end;
        gap: 0.5rem;
      }
    </style>
    <link rel="stylesheet" href="site/joinery/tokens.css" />
    <link rel="stylesheet" href="site/joinery/joinery.css" />
  </head>
  <body>
    <div>
      <div class="brand"><img src="site/logo.svg" width="52" height="52" alt="" />Joinery</div>
      <h1>Every shadcn/ui component.<br /><span class="accent">Joined to Ember.</span></h1>
      <p>Accessible to WCAG 2.2 AA, in shadcn's styles, with a test harness for each one.</p>
    </div>
    <div class="card">
      <div class="jn-card group/card" data-slot="card" data-size="default">
        <div class="jn-card-header group/card-header" data-slot="card-header">
          <div class="jn-card-title jn-font-heading" data-slot="card-title">Edit profile</div>
          <div class="jn-card-description" data-slot="card-description">
            Make changes to your profile here.
          </div>
        </div>
        <div class="jn-card-content" data-slot="card-content">
          <div class="jn-field-group group/field-group" data-slot="field-group">
            <div
              class="jn-field group/field jn-field-orientation-vertical"
              role="group"
              data-slot="field"
              data-orientation="vertical"
            >
              <label
                class="jn-label jn-field-label group/field-label peer/field-label"
                data-slot="field-label"
                for="name"
                >Name</label
              >
              <input class="jn-input" data-slot="input" id="name" value="Pedro Duarte" />
            </div>
            <div
              class="jn-field group/field jn-field-orientation-horizontal"
              role="group"
              data-slot="field"
              data-orientation="horizontal"
            >
              <label
                class="jn-label jn-field-label group/field-label peer/field-label"
                data-slot="field-label"
                for="updates"
                >Email me about new components</label
              >
              <button
                type="button"
                role="switch"
                aria-checked="true"
                data-state="checked"
                class="jn-switch peer group/switch"
                data-slot="switch"
                data-size="default"
                id="updates"
              >
                <span data-state="checked" class="jn-switch-thumb" data-slot="switch-thumb"></span>
              </button>
            </div>
          </div>
        </div>
        <div class="jn-card-footer" data-slot="card-footer">
          <button
            type="button"
            class="jn-button group/button jn-button-variant-outline jn-button-size-default"
            data-slot="button"
            data-variant="outline"
            data-size="default"
          >
            Cancel
          </button>
          <button
            type="button"
            class="jn-button group/button jn-button-variant-default jn-button-size-default"
            data-slot="button"
            data-variant="default"
            data-size="default"
          >
            Save changes
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
