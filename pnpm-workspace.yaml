packages:
  - 'packages/*'
  - 'test-app'
  - 'docs-app'
  - 'examples/*'

allowBuilds:
  core-js: false
  esbuild: true
  # Tailwind's CLI watcher; its prebuilt binary installs without the script.
  '@parcel/watcher': false

# CI's Ember 6.12 run inserts `ember-source: ~6.12.0` directly under `overrides:`, so the
# packages' dev copy and the test app agree on one ember-source. Keep `overrides:` a top-level
# key with nothing on its line.
overrides:
  # Examples ask for the published ranges; inside the workspace they get the local packages.
  '@ember-joinery/carousel': 'workspace:*'
  '@ember-joinery/chart': 'workspace:*'
  '@ember-joinery/code-block': 'workspace:*'
  '@ember-joinery/data-table': 'workspace:*'
  '@ember-joinery/ember': 'workspace:*'
  '@ember-joinery/file-upload': 'workspace:*'
  '@ember-joinery/primitives': 'workspace:*'
  '@ember-joinery/test-support': 'workspace:*'
  '@ember-joinery/tiptap': 'workspace:*'
  # Kolay pins an older @glint/template; one copy keeps template types compatible.
  '@glint/template': ^1.9.0

# ember-repl (a Kolay dependency, used by docs-app) is a v2 addon with no addon-main file,
# which the classic-compat build requires. The patch adds the standard shim.
packageExtensions:
  ember-repl@8:
    dependencies:
      '@embroider/addon-shim': ^1.10.3
patchedDependencies:
  ember-repl@8.2.3: patches/ember-repl@8.2.3.patch

# ember-eslint-parser hits a require(esm) cycle error on Node 22.14; run scripts on 24.
useNodeVersion: 24.11.1
